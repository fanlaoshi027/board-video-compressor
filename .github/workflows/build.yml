name: Build Board Video Compressor

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src -Force
          $root = Get-ChildItem ffmpeg-src -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe" bin\ffmpeg.exe
          Copy-Item "$($root.FullName)\bin\ffprobe.exe" bin\ffprobe.exe
      - name: Validate
        run: python -m py_compile smart_gui.py smart_runner.py smart_invert.py smart_invert_pipeline.py compress.py
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BoardVideoCompressor --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin" smart_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: BoardVideoCompressor-Windows
          path: dist/BoardVideoCompressor.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          brew install ffmpeg
      - name: Validate
        run: python -m py_compile smart_gui.py smart_runner.py smart_invert.py smart_invert_pipeline.py compress.py
      - name: Build Apple Silicon app
        env:
          ARCHFLAGS: "-arch arm64"
        run: python -m PyInstaller --noconfirm --clean --windowed --target-architecture arm64 --name BoardVideoCompressor smart_gui.py
      - name: Verify app architecture
        run: |
          file dist/BoardVideoCompressor.app/Contents/MacOS/BoardVideoCompressor
          codesign --force --deep --sign - dist/BoardVideoCompressor.app
      - name: Package standard macOS zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/BoardVideoCompressor.app dist/BoardVideoCompressor-macOS-arm64.zip
          unzip -t dist/BoardVideoCompressor-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BoardVideoCompressor-macOS-arm64
          path: dist/BoardVideoCompressor-macOS-arm64.zip
