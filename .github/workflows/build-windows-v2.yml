name: Build Windows app v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src -Force
          $root = Get-ChildItem ffmpeg-src -Directory | Select-Object -First 1
          if (!(Test-Path "$($root.FullName)\bin\ffmpeg.exe")) { throw "FFmpeg binary missing" }
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe" bin\ffmpeg.exe
          Copy-Item "$($root.FullName)\bin\ffprobe.exe" bin\ffprobe.exe

      - name: Validate Python sources
        run: python -m py_compile app.py app_windows.py compress.py size_estimator.py gpu_detect.py

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BoardVideoCompressor --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin" app_windows.py

      - name: Verify Windows EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\BoardVideoCompressor.exe")) { throw "EXE was not created" }
          Get-Item "dist\BoardVideoCompressor.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: board-video-compressor-windows-v2
          path: dist/BoardVideoCompressor.exe
